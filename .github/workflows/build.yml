name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Deterministic Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from repository base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating consistent debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APKs with Dynamic Version Code
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-app-apks
          path: app/build/outputs/apk/**/*.apk
