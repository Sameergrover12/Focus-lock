name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup & Lock Permanent Keystore in Vault Branch
        run: |
          mkdir -p ~/.android
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin keystore-vault >/dev/null 2>&1; then
            echo "Restoring permanent keystore from keystore-vault branch..."
            git fetch origin keystore-vault
            git checkout origin/keystore-vault -- debug.keystore
          else
            echo "Creating permanent keystore for the first time and locking in keystore-vault..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git checkout --orphan keystore-vault-temp
            git rm -rf --cached .
            git add -f debug.keystore
            git commit -m "chore: lock permanent signing keystore in vault"
            git push origin keystore-vault-temp:refs/heads/keystore-vault
            git checkout -f ${{ github.ref_name }}
            git fetch origin keystore-vault
            git checkout origin/keystore-vault -- debug.keystore
          fi

          # Copy permanent keystore to all standard & custom paths so Gradle always uses it
          cp debug.keystore release.keystore
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          cp debug.keystore app/release.keystore 2>/dev/null || true

          # Also create focuslock.keystore with matching key if app/build.gradle.kts checks for it
          keytool -importkeystore -srckeystore debug.keystore -srcstorepass android -srcalias androiddebugkey -srckeypass android \
            -destkeystore app/focuslock.keystore -deststorepass focuslock123 -destalias focuslockkey -destkeypass focuslock123 -noprompt 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3.1'

      - name: Build APKs with Auto-Increment Version Code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-app-apks
          path: app/build/outputs/apk/**/*.apk
 
