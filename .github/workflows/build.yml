name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Keystores for Persistent In-Place Updates
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Restoring persistent keystore from GitHub Secret..."
            echo "$SIGNING_KEY_BASE64" | base64 -d > debug.keystore
            echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent keystore from repository debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore release.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore from repository..."
            cp debug.keystore release.keystore
          else
            echo "Generating persistent debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore release.keystore
          fi
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          cp release.keystore app/release.keystore 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APKs with Auto-Increment Version Code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-app-apks
          path: app/build/outputs/apk/**/*.apk
